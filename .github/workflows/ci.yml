# GitHub Actions Workflow for CI/CD Pipeline
# This workflow is triggered on pushes and pull requests to the 'main' and 'dev' branches.
# This project uses Yarn 3 through Corepack. Each Node.js enables Corepack before installing dependencies so the Yarn version declared in package.json is used consistently in development and CI.

name: CI

on:
    push:
        branches: [main, dev] # Triggers the workflow on PUSHES to 'main' and 'dev'
    pull_request:
        branches: [main, dev] # Triggers the workflow on PULL REQUESTS targeting 'main' and 'dev'

# Jobs only require read access to repository contents
permissions:
    contents: read

jobs:
    # Verify that the dependency manifest and lockfiles are valid before allowing style, test, security and build jobs to begin
    # Dependency setup job
    dependencies:
        name: dependencies
        runs-on: ubuntu-latest
        timeout-minutes: 30 # Stop job if it runs longer than 30 minutes

        steps:
            - name: checkout code
              uses: actions/checkout@v6

            # Set up the Node.js environment with the specified version
            # DDT currently uses Node.js 20
            - name: node environment setup
              uses: actions/setup-node@v6
              with:
                  node-version: 20

            # Enable the package manager included in Node.js. Corepack selects the Yarn version declared in package.json
            - name: enable corepack
              run: corepack enable

            # Record the version of yarn used
            - name: confirm yarn version
              run: yarn --version

            # Do not modify yarn.lock during CI, install project dependencies, upgraded frozen-lockfile to immutable
            - name: install dependencies
              run: yarn install --immutable

    # Style check job (linting)
    # Check that the source files follow the projects formatting and style rules
    style:
        name: style
        runs-on: ubuntu-latest
        needs: dependencies # Ensure this job only runs after the 'dependencies' job is successful

        steps:
            - name: checkout code
              uses: actions/checkout@v6

            # Set up the Node.js environment with the specified version
            # DDT currently uses Node.js 20
            - name: node environment setup
              uses: actions/setup-node@v6
              with:
                  node-version: 20

            # Enable the package manager included in Node.js. Corepack selects the Yarn version declared in package.json
            - name: enable corepack
              run: corepack enable

            # Record the version of yarn used
            - name: confirm yarn version
              run: yarn --version

            # Do not modify yarn.lock during CI, install project dependencies, upgraded frozen-lockfile to immutable
            - name: install dependencies
              run: yarn install --immutable

            # Run the style check
            - name: run style check
              run: yarn run style

    # General tests
    # Run the automated test suite after dependency validation
    test:
        name: test
        runs-on: ubuntu-latest
        needs: dependencies # Ensure this job only runs after the 'dependencies' job is successful

        steps:
            - name: checkout code
              uses: actions/checkout@v6

            # Set up the Node.js environment with the specified version
            # DDT currently uses Node.js 20
            - name: node environment setup
              uses: actions/setup-node@v6
              with:
                  node-version: 20

            # Enable the package manager included in Node.js. Corepack selects the Yarn version declared in package.json
            - name: enable corepack
              run: corepack enable

            # Record the version of yarn used
            - name: confirm yarn version
              run: yarn --version

            # Do not modify yarn.lock during CI, install project dependencies, upgraded frozen-lockfile to immutable
            - name: install dependencies
              run: yarn install --immutable

            # Run the general test
            - name: run test
              run: yarn run test

    # Security tests
    # Scan the repository and its dependencies for known vulnerabilities and verified secrets
    security_test:
        name: security_test
        runs-on: ubuntu-latest
        needs: dependencies # Ensure this job only runs after the 'dependencies' job is successful

        steps:
            - name: checkout code
              uses: actions/checkout@v6

            # Set the current date to match the pre-existing cache key generated by trivy-update.yml
            - name: Set current date
              id: date
              run: echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

            # Attempt to restore the Trivy cache
            - name: Restore Trivy Cache
              id: cache
              uses: actions/cache@v5
              with:
                  path: ${{ github.workspace }}/.cache/trivy
                  key: cache-trivy-${{ steps.date.outputs.date }}
                  restore-keys: |
                      cache-trivy-

            # Set environment to skip database updates if the cache is restored
            - name: Set TRIVY_SKIP_DB_UPDATE environment variable
              if: steps.cache.outputs.cache-hit == 'true'
              run: echo "TRIVY_SKIP_DB_UPDATE=true" >> $GITHUB_ENV

            # Set environment to skip Java database updates if the cache is restored
            - name: Set TRIVY_SKIP_JAVA_DB_UPDATE environment variable
              if: steps.cache.outputs.cache-hit == 'true'
              run: echo "TRIVY_SKIP_JAVA_DB_UPDATE=true" >> $GITHUB_ENV

            # Backup mechanism - Trivy can cause a fatal error if the cache is missing when attempting to skip DB update.
            # If the cache is not found, the required databases will be manually downloaded and extracted to prevent errors.

            - name: Download and Extract Trivy DB (on cache miss)
              if: steps.cache.outputs.cache-hit != 'true'
              run: |
                  mkdir -p $GITHUB_WORKSPACE/.cache/trivy/db
                  oras pull ghcr.io/aquasecurity/trivy-db:2
                  tar -xzf db.tar.gz -C $GITHUB_WORKSPACE/.cache/trivy/db
                  rm db.tar.gz

            - name: Download and Extract Java DB (on cache miss)
              if: steps.cache.outputs.cache-hit != 'true'
              run: |
                  mkdir -p $GITHUB_WORKSPACE/.cache/trivy/java-db
                  oras pull ghcr.io/aquasecurity/trivy-java-db:1
                  tar -xzf javadb.tar.gz -C $GITHUB_WORKSPACE/.cache/trivy/java-db
                  rm javadb.tar.gz

            # Vulnerability scanning
            - name: Run Trivy vulnerability scanner in repo mode
              uses: aquasecurity/trivy-action@0.36.0
              with:
                  scan-type: "fs"
                  ignore-unfixed: true
                  format: "table"
                  severity: "HIGH,CRITICAL"
                  exit-code: 1
              env:
                  TRIVY_SKIP_DB_UPDATE: ${{ env.TRIVY_SKIP_DB_UPDATE }}
                  TRIVY_SKIP_JAVA_DB_UPDATE: ${{ env.TRIVY_SKIP_JAVA_DB_UPDATE }}

            - name: Save updated Trivy Cache (on cache miss)
              if: steps.cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v5
              with:
                  path: ${{ github.workspace }}/.cache/trivy
                  key: cache-trivy-${{ steps.date.outputs.date }} # Cache key based on the current date

              # Secrets scan
            - name: Run TruffleHog scan
              run: |
                  docker run --rm -v "$PWD:/pwd" trufflesecurity/trufflehog:latest github \
                  --repo https://github.com/Hardhat-Enterprises/Deakin-Detonator-Toolkit \
                  --only-verified

    # Application build job
    build:
        name: build
        runs-on: ubuntu-latest
        needs: dependencies # Ensure this job only runs after the 'dependencies' job is successful

        steps:
            - name: checkout code
              uses: actions/checkout@v6

            # Set up the Node.js environment with the specified version
            # DDT currently uses Node.js 20
            - name: node environment setup
              uses: actions/setup-node@v6
              with:
                  node-version: 20

            # Enable the package manager included in Node.js. Corepack selects the Yarn version declared in package.json
            - name: enable corepack
              run: corepack enable

            # Record the version of yarn used
            - name: confirm yarn version
              run: yarn --version

            # Do not modify yarn.lock during CI, install project dependencies, upgraded frozen-lockfile to immutable
            - name: install dependencies
              run: yarn install --immutable

            # Build the project
            - name: build project
              run: yarn run build
